
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AccessPoint | Sign In</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg site-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                AccessPoint
            </a>

           
        </div>
    </nav>

    <!-- Login Section -->
    <main class="login-section section-padding">
        <div class="container">

            <div class="section-heading text-center">
                <span class="eyebrow">WELCOME BACK</span>
                <h1>Sign in to your account</h1>
                <p>Enter your details to continue.</p>
            </div>

            <div class="auth-card">

                <form id="loginForm" novalidate>

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="loginEmail" class="form-label">
                            Email address
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="loginEmail"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                        <div class="invalid-feedback">
                            Enter a valid email address.
                        </div>
                    </div>

                   <!-- Password -->
<div class="mb-3">
    <label for="loginPassword" class="form-label">
        Password
    </label>

    <div class="password-wrapper">
        <input
            type="password"
            class="form-control"
            id="loginPassword"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

        <button
            type="button"
            class="password-toggle"
            data-toggle-password="loginPassword"
            aria-label="Show password"
            title="Show password"
        >👁</button>
    </div>

    <div class="invalid-feedback">
        Enter your password.
    </div>
</div>
        

                    <!-- Remember Me and Forgot Password -->
                    <div class="d-flex justify-content-between
                                align-items-center flex-wrap gap-2 mb-4">

                        <div class="form-check">
                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="rememberMe"
                            >

                            <label class="form-check-label" for="rememberMe">
                                Remember me
                            </label>
                        </div>

                        <a href="#"
                           id="forgotPasswordLink"
                           class="text-link">
                            Forgot password?
                        </a>
                    </div>

                    <!-- Login Button -->
                    <button
                        type="submit"
                        class="btn btn-primary btn-lg w-100"
                    >
                        Sign In
                    </button>

                    <!-- Login Feedback -->
                    <div
                        id="loginFeedback"
                        class="form-message"
                        role="status"
                        aria-live="polite"
                    ></div>

                </form>

                <!-- Registration Link -->
                <p class="auth-switch">
                    Don't have an account?
                    <a href="register.html">Create one</a>
                </p>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container text-center">
            <p class="mb-1">
                &copy; <span id="currentYear"></span> AccessPoint
            </p>

            <p class="mb-0">
                Designed with HTML, CSS, JavaScript and Bootstrap 5.
            </p>
        </div>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>

</body>
</html>
